[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anticlus"
version = "0.1.0"
description = "Python client for the Anticlus authorization gateway for voice agents."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = ["httpx>=0.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/anticlus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
